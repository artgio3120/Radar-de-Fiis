name: Instalar Radar FIIs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'payload.tar.gz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar projeto completo
        run: |
          tar -xzf payload.tar.gz -C .
          rm -f payload.tar.gz
          rm -f .github/workflows/bootstrap.yml

      - name: Commit do projeto
        run: |
          git config user.name "fii-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: instalar Radar Quantitativo de FIIs v2"
          git push
